[package]
name = "openseo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ego-tree = "0.11"
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = { version = "2.5.9", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.9"
wiremock = "0.6.5"
