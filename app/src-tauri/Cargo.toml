[package]
name = "openseo-app"
description = "OpenSEO desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openseo-core = { version = "0.1.0", path = "../../crates/openseo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `unstable` provides Window::add_child, for the off-screen renderer webview.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[build-dependencies]
tauri-build = "2"

# Linux: moves the renderer webview out of sight (see src/render.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
